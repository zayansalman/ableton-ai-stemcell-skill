name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The lockfile targets macOS on Apple Silicon only.
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install ffmpeg
        run: brew install ffmpeg
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run python -m pytest -q
