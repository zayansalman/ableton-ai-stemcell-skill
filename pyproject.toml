[project]
name = "stemcell"
version = "0.1.0"
description = "Local audio dissection pipeline: stems, tempo/key, drum one-shots, MIDI transcription"
readme = "README.md"
authors = [
    { name = "Zayan", email = "zayan_k@icloud.com" }
]
requires-python = ">=3.11,<3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
keywords = ["ableton", "stem-separation", "music-production", "midi", "demucs", "mcp", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
]
dependencies = [
    "basic-pitch==0.4.0",
    "demucs==4.1.0",
    "librosa>=0.10",
    "setuptools<81",
    "soundfile>=0.14.0",
    "torch>=2.4",
    "torchaudio>=2.4",
    "transformers>=4.40",
]

[project.urls]
Homepage = "https://github.com/zayansalman/ableton-ai-stemcell-skill"
Issues = "https://github.com/zayansalman/ableton-ai-stemcell-skill/issues"

[project.scripts]
stemcell = "stemcell.cli:main"

[build-system]
requires = ["uv_build>=0.10.8,<0.11.0"]
build-backend = "uv_build"

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
